<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireBot - HR Assistant</title>
    <link rel="stylesheet" href="style.css">
    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"
     alt="HireBot Logo"
     class="bot-logo">
</head>

<body>

    <div class="chatbot">

        <div class="chat-header">
            <div class="bot-info">
                <div class="bot-icon">
</div>

                <div>
                    <h2>HireBot</h2>
                    <p>HR Recruitment Assistant</p>
                </div>
            </div>

            <span class="online"> Online</span>
        </div>


        <div class="chat-box" id="chatBox">

            <div class="message bot">
                <div class="avatar"></div>

                <div class="bubble">
                    Hello! <br>
                    I'm HireBot. How can I help you with
                    recruitment today?
                </div>
            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Ask about jobs, interviews, skills..."
            >
<button id="sendBtn">➤</button>
           

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
